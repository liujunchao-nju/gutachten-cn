name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke test the CLI
        run: |
          python -m gutachten_cn list
          python -m gutachten_cn show --system claim-basis
          python -m gutachten_cn outline --domain criminal --case examples/case_input.json | head -20
          python -m gutachten_cn check --system three-tier --file examples/criminal_sample.md
