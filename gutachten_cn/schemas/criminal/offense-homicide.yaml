system: offense-homicide
label: 故意杀人罪检视程式
domain: criminal
default: false
version: 1

description: >
  针对故意杀人罪（《刑法》第 232 条）的专门检视程式。本罪侵犯生命法益，
  是刑法分则最重之罪，检视重点有三：结果（死亡）与行为的因果关系、
  故意内容（杀人故意还是伤害故意）、以及未完成形态的认定。

source: |
  《中华人民共和国刑法》第 232 条。
  生命法益的起点与终点、死亡判断标准采刑法学通说（张明楷《刑法学》：
  人的生命自胎儿独立呼吸时起始，以心脏停止跳动或者脑死亡为准）。
  第 232 条：「故意杀人的，处死刑、无期徒刑或者十年以上有期徒刑；
  情节较轻的，处三年以上十年以下有期徒刑。」

subsumption:
  label: 涵摄四步法
  steps:
    - 总起句（设问）：就待检验的构成要件要素提出明确命题
    - 定义：阐明该要素的法律定义与判断标准
    - 归入（涵摄）：将本案事实逐项与定义比对
    - 结论：明确该要素成立或不成立，并交代不成立的后果

stages:
  - id: tatbestand
    label: 构成要件该当性
    order: 1
    nature: 积极检验
    checks:
      - id: objective_elements
        label: 客观构成要件
        required: true
        aliases: [客观要件]
        elements:
          - 行为：非法剥夺他人生命的行为（作为或者不作为）
          - 行为对象：他人（生命自胎儿独立呼吸时起始；本人自杀不成本罪对象）
          - 结果：被害人死亡
          - 因果关系与客观归责：死亡结果由行为直接造成，且属于构成要件效力范围
      - id: subjective_elements
        label: 主观构成要件
        required: true
        aliases: [主观要件]
        elements:
          - 杀人故意：认识到自己的行为会致人死亡，并希望或者放任该结果发生
          - 与伤害故意的区分：故意内容指向生命还是身体健康，是故意杀人罪与故意伤害罪的分界
          - 事实认识错误：对象错误、打击错误、因果关系错误不妨害故意既遂（法定符合说）

  - id: rechtswidrigkeit
    label: 违法性
    order: 2
    nature: 消极检验
    checks:
      - id: grounds_of_justification
        label: 违法阻却事由
        required: true
        aliases: [正当化事由]
        elements:
          - 正当防卫（含特殊防卫：第 20 条第三款，针对严重暴力犯罪的无限防卫）
          - 紧急避险
          - 被害人承诺（生命法益的承诺无效，不得阻却违法）
          - 依法令执行死刑等法令行为

  - id: schuld
    label: 有责性
    order: 3
    nature: 消极检验
    checks:
      - id: capacity
        label: 责任能力
        required: true
        aliases: [刑事责任能力]
        elements:
          - 刑事责任年龄（第 17 条：已满十六周岁；已满十四周岁不满十六周岁周岁犯故意杀人罪的，应当负刑事责任）
          - 辨认能力与控制能力（含尚未完全丧失责任能力的精神病人从宽：第 18 条第三款）
      - id: culpability
        label: 罪过形式
        required: true
        aliases: [罪过]
        elements:
          - 直接故意或者间接故意

  - id: special_issues
    label: 形态、竞合与量刑
    order: 4
    nature: 特别检视
    checks:
      - id: attempt
        label: 未遂与中止
        required: false
        aliases: [犯罪形态]
        elements:
          - 未遂：已着手实施剥夺生命的行为，因意志以外原因未发生死亡结果
          - 中止：自动放弃或者自动有效防止死亡结果发生（第 24 条）
      - id: concurrence
        label: 罪数竞合
        required: false
        aliases: [竞合]
        elements:
          - 与故意伤害（致死）：主观故意内容不同，致死结果可能是结果加重犯
          - 与过失致人死亡罪：过失情形不成立本罪
          - 一行为数结果（数人死亡）的竞合处理
      - id: sentencing
        label: 情节较轻与量刑因素
        required: false
        aliases: [量刑]
        elements:
          - 第 232 条「情节较轻」的典型情形（义愤杀人、防卫过当杀人、受嘱托杀人等通说归纳）
          - 自首、立功、累犯等法定量刑情节
          - 死刑适用的慎重立场（死刑只适用于罪行极其严重者）
