[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gutachten-cn"
version = "0.3.0"
description = "鉴定式案例分析：刑法阶层检验、罪名程式、民法请求权基础与行政行为合法性审查"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "刘俊超", email = "251820244@smail.nju.edu.cn" }]
keywords = ["gutachten", "鉴定式案例分析", "三阶层", "请求权基础", "行政行为", "中国法", "legal education", "agent skill"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup",
    "Intended Audience :: Legal Industry",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/liujunchao-nju/gutachten-cn"
Issues = "https://github.com/liujunchao-nju/gutachten-cn/issues"

[project.scripts]
gutachten-cn = "gutachten_cn.cli:main"

[tool.setuptools]
packages = ["gutachten_cn"]

[tool.setuptools.package-data]
gutachten_cn = ["schemas/*.yaml", "schemas/**/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
